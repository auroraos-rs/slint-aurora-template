[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,--disable-new-dtags", "-C", "link-arg=-Wl,-rpath,$ORIGIN/../share/{{org_domain}}.{{project-name}}/lib", "-C", "link-arg=-L/usr/share/{{org_domain}}.{{project-name}}/lib"]

[target.armv7-unknown-linux-gnueabihf]
rustflags = ["-C", "link-arg=-Wl,--disable-new-dtags", "-C", "link-arg=-Wl,-rpath,$ORIGIN/../share/{{org_domain}}.{{project-name}}/lib", "-C", "link-arg=-L/usr/share/{{org_domain}}.{{project-name}}/lib"]
